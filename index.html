<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f1f3f6" />
<title>可视化清单</title>
<style>
:root{
  --bg:#f1f3f6;--card:#fff;--navy:#1e3a5f;--text:#1f2937;--muted:#8a94a6;--done:#a0a8b6;
  --green:#3fba6f;--green-track:#dfe5ec;--red:#d93a3a;--red-bg:#fdecec;--line:#e3e7ee;
  --shadow:0 1px 3px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.04);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.45;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{outline:none}
.app{max-width:640px;margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:4px}
.catalog-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:#fff;color:var(--navy);font-weight:700;font-size:.92rem;box-shadow:var(--shadow);border:1px solid var(--line)}
.catalog-btn:hover,.catalog-btn:focus-visible{background:#e8eef6;outline:none}
.catalog-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-right{display:flex;align-items:center;gap:8px}
.refresh-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:10px;background:#fff;color:var(--navy);font-weight:700;font-size:.92rem;box-shadow:var(--shadow);border:1px solid var(--line)}
.refresh-btn:hover,.refresh-btn:focus-visible{background:#e8eef6;outline:none}
.refresh-btn:disabled{opacity:.55;cursor:wait}
.refresh-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ibtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:#9aa3b2}
.ibtn:hover,.ibtn:focus-visible{background:#e4e8ee;color:var(--navy);outline:none}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#c3c9d3;position:absolute;top:8px;right:8px}
.sync-dot.on{background:var(--green)}.sync-dot.err{background:var(--red)}.sync-dot.busy{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.more-wrap{position:relative}
h1.title{text-align:center;font-size:1.45rem;font-weight:800;color:var(--navy);margin:2px 0 14px;letter-spacing:.02em;word-break:break-word}
.bar{height:8px;background:var(--green-track);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s ease}
.count{text-align:center;color:var(--muted);font-size:.85rem;margin:10px 0 18px}
.done-banner{display:none;text-align:center;color:var(--green);font-weight:700;margin:-8px 0 16px}
.done-banner.show{display:block}
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.pill{display:inline-block;padding:5px 12px;border-radius:7px;color:#fff;font-weight:700;font-size:.95rem}
.gcount{color:var(--muted);font-size:.78rem;margin-left:4px}
.items{list-style:none;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-height:60px;cursor:pointer;user-select:none;transition:transform .1s;width:100%;text-align:left}
.item:active{transform:scale(.99)}
.chk{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid #cfd5de;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s}
.chk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.item.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.body{flex:1;min-width:0;font-size:1rem;color:var(--text);word-break:break-word}
.item.done .txt{color:var(--done);text-decoration:line-through}
.tag{display:inline;margin-left:8px;padding:2px 7px;border-radius:4px;background:var(--red-bg);color:var(--red);font-size:.78rem;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.note{display:block;font-size:.8rem;color:var(--muted);margin-top:3px}
.qty{flex-shrink:0;font-weight:700;color:#8a94a6;font-size:1rem;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:.95rem;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;opacity:0;visibility:hidden;transition:.2s}
.overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,88vw);background:#fff;z-index:60;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line);font-weight:800;font-size:1.05rem;color:var(--navy)}
.dbody{flex:1;overflow:auto;padding:12px}
.dhint{padding:0 16px 10px;font-size:.8rem;color:var(--muted)}
.litem{display:flex;width:100%;gap:8px;padding:14px 12px;border-radius:12px;text-align:left;margin-bottom:6px;border:1px solid transparent}
.litem:hover{background:#f3f5f8}.litem.active{background:#e8eef6;color:var(--navy);font-weight:700;border-color:#c5d4e8}
.litem span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem span:last-child{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.ltree{margin-bottom:8px}
.litem .chev{width:18px;flex-shrink:0;transition:transform .2s;color:var(--muted)}
.litem .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ltree.open .litem .chev{transform:rotate(90deg);color:var(--navy)}
.glist{display:none;padding:2px 0 6px 10px;border-left:2px solid var(--line);margin:0 0 4px 18px}
.ltree.open .glist{display:block}
.gitem{display:flex;align-items:center;gap:8px;width:100%;padding:10px 10px;border-radius:10px;text-align:left;margin-bottom:2px;font-size:.9rem;color:var(--text)}
.gitem:hover{background:#f3f5f8}
.gitem .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gitem .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .gc{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.dfoot{padding:12px;border-top:1px solid var(--line)}
.dfoot .btn{width:100%}
.share-mode .topbar{justify-content:space-between}
.menu{position:fixed;top:56px;right:max(12px,calc(50% - 308px));background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:55;padding:6px;min-width:180px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:8px;font-size:.92rem}
.menu button:hover{background:#f3f5f8}
.mwrap{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:.2s}
.mwrap.open{opacity:1;visibility:visible}
@media(min-width:540px){.mwrap{align-items:center}}
.modal{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:20px;max-height:90vh;overflow:auto}
.modal h3{color:var(--navy);margin-bottom:6px}
.mdesc{color:var(--muted);font-size:.88rem;margin-bottom:14px;white-space:pre-line;word-break:break-all}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#f8f9fb;font-size:.95rem}
.field input:focus{border-color:var(--navy);background:#fff}
.sync-status{font-size:.82rem;color:var(--muted);line-height:1.5;min-height:2.4em;padding:8px 10px;background:#f3f5f8;border-radius:8px;margin-bottom:12px;word-break:break-word}
.sync-status.ok{color:#166534;background:#ecfdf3}.sync-status.err{color:#991b1b;background:var(--red-bg)}
.macts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:10px;font-weight:600;font-size:.92rem}
.btn-p{background:var(--navy);color:#fff}.btn-g{background:#eef1f5;color:#334155}.btn-d{background:var(--red-bg);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,80px);background:#1f2937;color:#fff;padding:9px 18px;border-radius:99px;font-size:.88rem;opacity:0;transition:.3s;z-index:100;pointer-events:none;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button type="button" class="catalog-btn" id="bCatalog" aria-label="目录：切换清单">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
      目录
    </button>
    <div class="top-right">
      <button type="button" class="refresh-btn" id="bRefresh" aria-label="刷新" title="从云端拉取最新">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新
      </button>
      <div class="more-wrap">
        <button type="button" class="ibtn" id="bMore" aria-label="更多" title="更多">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
        <span class="sync-dot" id="syncDot" title="同步状态"></span>
      </div>
    </div>
  </div>
  <h1 class="title" id="title">清单</h1>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="fill" id="fill"></div></div>
  <p class="count" id="count">已核对 0 / 0</p>
  <p class="done-banner" id="banner">✓ 全部核对完成</p>
  <main id="main"></main>
</div>

<div class="menu" id="menu" role="menu">
  <button type="button" data-m="share" class="owner-only">分享此清单</button>
  <button type="button" data-m="sync" class="owner-only">同步设置</button>
  <button type="button" data-m="shareRefresh" class="share-only hidden">刷新</button>
  <button type="button" data-m="shareForget" class="share-only hidden">退出（忘记口令）</button>
  <button type="button" data-m="syncNow" class="owner-only">立即同步</button>
  <button type="button" data-m="uncheck">全部取消勾选</button>
  <button type="button" data-m="clear">清除已完成</button>
  <button type="button" data-m="export">导出当前 JSON</button>
  <button type="button" data-m="exportAll">导出全部 JSON</button>
  <button type="button" data-m="import">导入 JSON</button>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="目录">
  <div class="dhead">目录<button type="button" class="ibtn" id="bClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <p class="dhint" id="dhint">点清单切换；点分组跳转。新建 / 编辑请在对话中告诉助手。</p>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot">
    <button type="button" class="btn btn-g" id="bTop">↑ 回到顶端</button>
  </div>
</aside>

<div class="mwrap" id="mConfirm" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 id="ctitle"></h3>
    <p class="mdesc" id="cdesc"></p>
    <div class="macts">
      <button type="button" class="btn btn-g" id="ccancel">取消</button>
      <button type="button" class="btn btn-d hidden" id="cextra"></button>
      <button type="button" class="btn btn-p" id="cok">确定</button>
    </div>
  </div>
</div>

<div class="mwrap" id="mSync" role="dialog" aria-modal="true">
  <div class="modal">
    <h3>同步设置</h3>
    <p class="mdesc" id="syncDesc">输入一次同步口令，之后这台设备会自动同步。口令只留在本浏览器。</p>
    <div class="field">
      <label for="syncPass">同步口令</label>
      <input id="syncPass" type="password" autocomplete="current-password" inputmode="text" />
    </div>
    <div class="sync-status" id="syncStatus">还没有同步口令。填一次之后会自动同步。</div>
    <div class="macts">
      <button type="button" class="btn btn-g" id="syncClose">关闭</button>
      <button type="button" class="btn btn-p" id="syncSave">保存</button>
    </div>
  </div>
</div>

<div class="mwrap" id="mPass" role="dialog" aria-modal="true">
  <form class="modal" id="passForm" autocomplete="off">
    <h3>共享清单</h3>
    <p class="mdesc" id="passMsg">请输入分享口令</p>
    <div class="field"><label for="passInput">口令</label><input id="passInput" type="password" inputmode="text" autocomplete="current-password" /></div>
    <div class="macts"><button type="submit" class="btn btn-p">进入</button></div>
  </form>
</div>

<input type="file" id="file" accept="application/json,.json" class="hidden" />
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const KEY="checklist-app-v1";
const CFG_KEY="checklist-gist-cfg";
const META_KEY="checklist-gist-meta";
const SEED_KEY="checklist-sample-seed";
const COLORS=["#1e3a5f","#2f6db3","#2a7d7b","#6b4fa0","#b5651d","#3d4a5c"];
const TICK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function I(text,qty,tag,checked,note){return{id:uid(),text,qty:qty||"",tag:tag||"",note:note||"",checked:!!checked,createdAt:Date.now()}}
function sample(){
  const gear={id:"demo-gear",name:"影视拍摄器材验收清单",updatedAt:Date.now(),groups:[
    {id:uid(),name:"摄影组",color:COLORS[0],items:[
      I("Sony FX3 摄影机","×1","",true),I("雅典娜镜头套装 24+35+50","×1套","只成套租",true),
      I("铁头遮光斗","×1"),I("图瑞斯V18云台","×1"),I("4×1黑柔滤镜","×1"),
      I("跟焦器（原力M）","×1"),I("摄影机套件底座","×1套","楚门提供")]},
    {id:uid(),name:"监看组",color:COLORS[1],items:[I("大疆图传（一发）","×1"),I("大疆小监","×3"),I("监视器遮光罩","×3")]},
    {id:uid(),name:"灯光组",color:COLORS[2],items:[I("艾蒙拉 600d","×2"),I("柔光箱","×2","需提前确认"),I("灯架","×4"),I("V口电池","×6")]}]};
  const exhibit={id:"demo-exhibit",name:"展陈布置",updatedAt:Date.now()-1000,groups:[
    {id:uid(),name:"现场准备",color:COLORS[0],items:[I("确认展位尺寸与承重","","",true),I("核对灯光与电源点位"),I("测量参观动线宽度","","","","不少于 1.2m")]},
    {id:uid(),name:"展品与说明",color:COLORS[1],items:[I("展品清点与编号","×24"),I("说明牌与二维码","×24","需打印"),I("防撞与限高提示","×6")]}]};
  const daily={id:"demo-daily",name:"日常事项",updatedAt:Date.now()-2000,groups:[
    {id:uid(),name:"今天",color:COLORS[2],items:[I("回复邮件与消息"),I("整理待办优先级"),I("喝水 / 站立活动","×8","每小时")]}]};
  return{version:2,updatedAt:Date.now(),activeListId:gear.id,lists:[gear,exhibit,daily]};
}

let S;
let cfg={passcode:""};
let meta={lastSync:0,lastError:"",lastOk:false,needPasscode:false,status:""};
let syncBusy=false;
let pushTimer=null;
let suppressPush=false;
let freshSample=false;
let passcodeBad=false;
let lastToastStatus="";
let syncRev=0;

function normItem(it){return{id:it.id||uid(),text:String(it.text||""),qty:String(it.qty||""),tag:String(it.tag||""),note:String(it.note||""),checked:!!it.checked,u:Number(it.u)||0,createdAt:it.createdAt||Date.now()}}
function normList(l){return{id:l.id||uid(),name:l.name||"导入清单",updatedAt:Number(l.updatedAt)||0,share:l.share&&l.share.id?l.share:undefined,
  groups:(Array.isArray(l.groups)?l.groups:[]).map((g,gi)=>({id:g.id||uid(),name:g.name||"分组",color:g.color||COLORS[gi%COLORS.length],items:(Array.isArray(g.items)?g.items:[]).map(normItem)}))}}
function normState(p){
  if(!p||!Array.isArray(p.lists))return null;
  const lists=p.lists.map(normList);
  if(!lists.length)return null;
  let active=p.activeListId;
  if(!lists.some(l=>l.id===active))active=lists[0].id;
  const maxList=lists.reduce((m,l)=>Math.max(m,l.updatedAt||0),0);
  const deleted={...(p.deleted||{})};(p.deletedListIds||[]).forEach(id=>{if(!deleted[id])deleted[id]=Number(p.updatedAt)||Date.now()});
  const lists2=lists.filter(l=>!((deleted[l.id]||0)>=(l.updatedAt||0)));
  return{version:3,updatedAt:Number(p.updatedAt)||maxList||Date.now(),activeListId:lists2.some(l=>l.id===active)?active:(lists2[0]&&lists2[0].id),lists:lists2,sharesGistId:p.sharesGistId||undefined,deleted,deletedListIds:Object.keys(deleted)};
}

function loadCfg(){
  let strip=false;
  try{
    const c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");
    if(c&&typeof c==="object"){
      cfg.passcode=String(c.passcode||"");
      if(c.gistId||c.token||c.fileName){strip=true;if(!cfg.passcode)meta.needPasscode=true}
    }
  }catch(e){}
  try{
    const m=JSON.parse(localStorage.getItem(META_KEY)||"null");
    if(m){meta.lastSync=m.lastSync||0;meta.lastError=m.lastError||"";meta.lastOk=!!m.lastOk;meta.needPasscode=meta.needPasscode||!!m.needPasscode;meta.status=m.status||""}
  }catch(e){}
  if(strip)saveCfg();
}
function saveCfg(){
  localStorage.setItem(CFG_KEY,JSON.stringify({passcode:cfg.passcode||""}));
  localStorage.setItem(META_KEY,JSON.stringify({lastSync:meta.lastSync||0,lastError:meta.lastError||"",lastOk:!!meta.lastOk,needPasscode:!!meta.needPasscode,status:meta.status||""}));
  updateSyncDot();
}

function loadLocal(){
  try{
    const p=JSON.parse(localStorage.getItem(KEY)||"null");
    const n=normState(p);
    if(n){S=n;freshSample=localStorage.getItem(SEED_KEY)==="1";return}
  }catch(e){}
  S=sample();freshSample=true;
  try{localStorage.setItem(SEED_KEY,"1")}catch(e){}
  saveLocal();
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("本地保存失败")}}

const cur=()=>S.lists.find(l=>l.id===S.activeListId);
const tot=l=>l.groups.reduce((n,g)=>n+g.items.length,0);
const dn=l=>l.groups.reduce((n,g)=>n+g.items.filter(i=>i.checked).length,0);

function commit(opts){
  syncRev++;
  freshSample=false;
  try{localStorage.removeItem(SEED_KEY)}catch(e){}
  const l=cur();if(l)l.updatedAt=Date.now();
  S.updatedAt=Date.now();
  saveLocal();
  render();
  if(!(opts&&opts.skipPush)) schedulePush();
}

let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}

function updateSyncDot(){
  const d=$("syncDot");
  d.classList.remove("on","err","busy");
  d.title=meta.status||"同步";
  if(syncBusy){d.classList.add("busy");return}
  if(!cfg.passcode)return;
  if(meta.lastOk)d.classList.add("on");
  else if(meta.lastError)d.classList.add("err");
}

function setStatus(text,kind){
  const el=$("syncStatus");
  el.textContent=text;

function refreshStatusLine(){

/** Union merge: lists = (local ∪ remote) − tombstones. Tombstone wins only if newer than the list's updatedAt.
 *  Same list on both sides: newer updatedAt supplies content; per-item check state LWW by item.u.
 *  Root updatedAt is informational only and never decides which lists exist. */
function mergeStates(local,remote){
  if(!remote)return{state:local,changed:false,source:"local"};
  if(!local)return{state:remote,changed:true,source:"remote"};
  const deleted={};
  const addTomb=(k,v)=>{const n=Number(v)||0;if(n>(Number(deleted[k])||0))deleted[k]=n};
  [local,remote].forEach(s=>{
    Object.entries(s.deleted||{}).forEach(([k,v])=>addTomb(k,v));
    (s.deletedListIds||[]).forEach(id=>{if(!(deleted[id]>0))addTomb(id,s.updatedAt||1)});
  });
  const L=new Map(local.lists.map(l=>[l.id,l])),R=new Map(remote.lists.map(l=>[l.id,l]));
  const ids=[...new Set([...remote.lists.map(l=>l.id),...local.lists.map(l=>l.id)])];
  const lists=[];let changed=false;
  for(const id of ids){
    const a=L.get(id),b=R.get(id);
    let out;
    if(a&&b){
      const newer=(Number(b.updatedAt)||0)>(Number(a.updatedAt)||0)?b:a, older=newer===a?b:a;
      out=JSON.parse(JSON.stringify(newer));
      mergeChecks(out,older); // per-item LWW
      if(newer===b||JSON.stringify(out)!==JSON.stringify(a))changed=true;
    }else{out=a||b;if(!a)changed=true}
    if((Number(deleted[id])||0)>=(Number(out.updatedAt)||0)){if(a)changed=true;continue}
    lists.push(out);
  }
  if(!lists.length&&(local.lists[0]||remote.lists[0]))lists.push(remote.lists[0]||local.lists[0]);
  let activeListId=lists.some(l=>l.id===local.activeListId)?local.activeListId:(lists.some(l=>l.id===remote.activeListId)?remote.activeListId:lists[0]&&lists[0].id);
  const updatedAt=Math.max(Number(local.updatedAt)||0,Number(remote.updatedAt)||0);
  const state={version:3,updatedAt,activeListId,lists,sharesGistId:remote.sharesGistId||local.sharesGistId,deleted,deletedListIds:Object.keys(deleted)};
  return{state,changed,source:"union"};
}

function passHeader(pw){
  const bytes=new TextEncoder().encode(pw);
  let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);
  return "base64:"+btoa(s);
}
function noteSync(text,kind,announce){
  meta.status=text;
  meta.lastOk=kind==="ok";
  meta.lastError=kind==="err"?text:"";
  if(kind==="ok")meta.lastSync=Date.now();
  saveCfg();
  setStatus(text,kind==="ok"?"ok":kind==="err"?"err":"");
  if(announce&&text!==lastToastStatus){toast(text);lastToastStatus=text}
  if(kind==="ok")lastToastStatus="";
}
async function syncRequest(method,body){
  const api=shareApi();
  if(!api){const e=new Error("离线，联网后自动同步");e.code="offline";throw e}
  let res;
  try{
    res=await fetch(api+"/sync",{
      method,cache:"no-store",
      headers:{Authorization:"Bearer "+passHeader(cfg.passcode),...(body?{"Content-Type":"application/json"}:{})},
      body:body?JSON.stringify(body):undefined
    });
  }catch(e){const err=new Error("离线，联网后自动同步");err.code="offline";throw err}
  if(res.status===401){const err=new Error("口令不对");err.code=401;throw err}
  if(res.status===429){const err=new Error("试太多次，请稍后再试");err.code=429;throw err}
  if(!res.ok){const err=new Error("离线，联网后自动同步");err.code="offline";throw err}
  return res.json();
}
function canon(s){return JSON.stringify({lists:(s&&s.lists)||[],deleted:(s&&s.deleted)||{}})}
function adopt(next){
  const keep=S.activeListId;
  const n=normState(next);
  if(!n)return false;
  if(keep&&n.lists.some(l=>l.id===keep))n.activeListId=keep;
  S=n;saveLocal();render();
  return true;
}
function clearSeed(){freshSample=false;try{localStorage.removeItem(SEED_KEY)}catch(e){}}
function mergeIn(payload){
  const remote=payload&&payload.empty?null:normState(payload);
  if(!remote)return false;
  const keep=S.activeListId;
  const merged=mergeStates(S,remote).state;
  if(keep&&merged.lists.some(l=>l.id===keep))merged.activeListId=keep;
  S=merged;saveLocal();render();
  return true;
}
async function syncPull(opts){
  const quiet=opts&&opts.quiet, force=opts&&opts.force;
  if(!cfg.passcode){
    if(!quiet){toast(meta.needPasscode?"请输入一次同步口令":"请先输入同步口令");openSyncSettings()}
    refreshStatusLine();updateSyncDot();return;
  }
  if(passcodeBad&&quiet&&!force)return;
  if(syncBusy)return;
  syncBusy=true;updateSyncDot();
  const mark=syncRev;
  try{
    const body=await syncRequest("GET");
    const remoteState=body&&body.empty?null:normState(body);
    suppressPush=true;
    if(freshSample&&remoteState&&syncRev===mark){
      adopt(remoteState);clearSeed();
    }else if(remoteState){
      mergeIn(body);
      if(canon(S)!==canon(remoteState)){
        const putMark=syncRev;
        const pushed=await syncRequest("PUT",S);
        mergeIn(pushed);
        if(syncRev!==putMark){suppressPush=false;schedulePush()}
      }
    }else if(!freshSample){
      const putMark=syncRev;
      const pushed=await syncRequest("PUT",S);
      mergeIn(pushed);
      if(syncRev!==putMark){suppressPush=false;schedulePush()}
    }
    suppressPush=false;
    passcodeBad=false;
    noteSync("已同步","ok",!quiet);
  }catch(e){
    suppressPush=false;
    if(e.code===401){passcodeBad=true;noteSync("口令不对","err",true)}
    else if(e.code===429)noteSync("试太多次，请稍后再试","err",true);
    else noteSync("离线，联网后自动同步","err",!quiet||meta.status!=="离线，联网后自动同步");
  }finally{
    syncBusy=false;updateSyncDot();
  }
}
async function syncPush(opts){
  const quiet=opts&&opts.quiet;
  if(!cfg.passcode||passcodeBad||freshSample)return;
  if(syncBusy){schedulePush();return}
  syncBusy=true;updateSyncDot();
  const putMark=syncRev;
  try{
    const pushed=await syncRequest("PUT",S);
    suppressPush=true;mergeIn(pushed);suppressPush=false;
    passcodeBad=false;
    noteSync("已同步","ok",!quiet);
    if(syncRev!==putMark)schedulePush();
  }catch(e){
    suppressPush=false;
    if(e.code===401){passcodeBad=true;noteSync("口令不对","err",true)}
    else if(e.code===429)noteSync("试太多次，请稍后再试","err",true);
    else noteSync("离线，联网后自动同步","err",true);
  }finally{
    syncBusy=false;updateSyncDot();
  }
}
function schedulePush(){
  if(suppressPush||!cfg.passcode||passcodeBad||freshSample)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>syncPush({quiet:true}),1000);
}

// After `wrangler deploy`, put the Worker origin here, e.g. "https://checklist-share.<sub>.workers.dev"
// Until then leave empty; share links can still pass ?api=https://….workers.dev
const SHARE_API_DEFAULT="https://checklist-share.haoyuyou50.workers.dev";
const QS=new URLSearchParams(location.search);
const SHARE=(QS.get("share")||"").match(/^[A-Za-z0-9_-]{6,40}$/)?QS.get("share"):null;
function shareApi(){
  const q=QS.get("api")||"";
  try{const u=new URL(q);if(u.protocol==="https:"&&/\.workers\.dev$/.test(u.hostname))return u.origin}catch(e){}
  return SHARE_API_DEFAULT.replace(/\/$/,"");
}
const SHARE_KEY=()=>"checklist-share-"+SHARE;
let sharePass="",shareTimer=null,sharePending=[];

function mergeChecks(target,source){ // per-item LWW on u; returns #changed in target
  const m=new Map();(source.groups||[]).forEach(g=>(g.items||[]).forEach(i=>m.set(i.id,i)));
  let n=0;(target.groups||[]).forEach(g=>(g.items||[]).forEach(i=>{const s=m.get(i.id);if(s&&(Number(s.u)||0)>(Number(i.u)||0)){if(i.checked!==!!s.checked)n++;i.checked=!!s.checked;i.u=Number(s.u)||0}}));

}

function shareSaveCache(){try{localStorage.setItem(SHARE_KEY(),JSON.stringify({pass:sharePass,list:cur()}))}catch(e){}}
async function shareFetch(method,path,body){
  const api=shareApi();if(!api)throw new Error("分享服务未配置");
  const res=await fetch(api+"/api/share/"+SHARE+(path||""),{method,headers:{"X-Share-Pass":sharePass,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  if(res.status===401){const e=new Error("口令不正确");e.code=401;throw e}
  if(res.status===404){const e=new Error("分享不存在或已停用");e.code=404;throw e}
  if(!res.ok)throw new Error("服务暂时不可用 ("+res.status+")");
  return res.json();
}
function shareApply(data){
  const local=cur();
  const list=normList(data.list);list.id=list.id||"shared";
  if(local&&local.id===list.id)mergeChecks(list,local); // keep my not-yet-confirmed taps
  S={version:2,updatedAt:Date.now(),activeListId:list.id,lists:[list]};
  shareSaveCache();render();
}

  catch(e){setDot("err");if(e.code===401){askSharePass("口令不正确或已更改，请重新输入");return}if(!quiet||e.code===404)toast(e.message)}
}
async function sharePost(changes){
  sharePending.push(...changes);
  clearTimeout(shareTimer);
  shareTimer=setTimeout(async()=>{
    const batch=sharePending.splice(0);if(!batch.length)return;
    setDot("busy");
    try{const d=await shareFetch("POST","/check",{changes:batch});shareApply(d);setDot("on")}
    catch(e){sharePending.unshift(...batch);setDot("err");toast("同步失败，稍后重试："+e.message);setTimeout(()=>sharePost([]),8000)}
  },500);
}

  document.querySelectorAll(".owner-only").forEach(e=>e.classList.add("hidden"));
  document.querySelectorAll(".share-only").forEach(e=>e.classList.remove("hidden"));
  $("bCatalog").classList.remove("hidden");
  $("dhint").textContent="点分组可跳转到对应区块。";
  $("menu").querySelectorAll('[data-m="clear"],[data-m="export"],[data-m="exportAll"],[data-m="import"]').forEach(e=>e.classList.add("hidden"));
  S={version:2,updatedAt:0,activeListId:null,lists:[]};
  let cache=null;try{cache=JSON.parse(localStorage.getItem(SHARE_KEY())||"null")}catch(e){}
  if(cache&&cache.list){S={version:2,updatedAt:0,activeListId:cache.list.id,lists:[normList(cache.list)]}}
  sharePass=(cache&&cache.pass)||"";
  if(cur())render();else{$("title").textContent="共享清单";$("main").innerHTML='<div class="empty">需要口令才能查看这份清单</div>'}
  $("passForm").onsubmit=e=>{e.preventDefault();const v=$("passInput").value.trim();if(!v)return;sharePass=v;$("mPass").classList.remove("open");shareLoad(true)};
  if(!shareApi()){toast("分享服务未配置");return}
  if(sharePass)shareLoad(true);else askSharePass();
  setInterval(()=>{if(sharePass&&!document.hidden&&!sharePending.length)shareLoad(true)},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sharePass)shareLoad(true)});
}

/* ---- boot ---- */
if(SHARE){
  bootShare(); // recipients: never touch owner config, owner gist, or other lists
}else{
  loadCfg();
  loadLocal();
  render();
  updateSyncDot();
  refreshStatusLine();
  if(meta.needPasscode&&!cfg.passcode)openSyncSettings();
  else if(cfg.passcode)syncPull({quiet:true});
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){if(pushTimer){clearTimeout(pushTimer);pushTimer=null;syncPush({quiet:true})}}
    else syncPull({quiet:true});
  });
  window.addEventListener("online",()=>syncPull({quiet:true}));
}

/* ---- expose for dry-run tests ---- */
window.__checklistTest={
  mergeStates,normState,sample,
  getState:()=>S,setState:s=>{S=s},
  getCfg:()=>cfg,setCfg:c=>{cfg=c},mergeChecks,isShare:()=>!!SHARE
};
})();
</script>
</body>
</html>
